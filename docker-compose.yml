services:
  postgres:
    image: postgres:16
    container_name: conexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conexus
    ports:
      - "5433:5432"
    volumes:
      - conexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conexus-pgdata:
